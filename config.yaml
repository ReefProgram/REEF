# Reef config: Kalshi NBA markets, PAPER ledger only.
# "Placed" = written to data/bets.csv. Read-only public market data; no credentials,
# no order/portfolio endpoints, ever. Flat key: value so it parses with or without PyYAML.
league: NBA                         # NBA only
run_window_pt: "15:00-16:00"        # daily run window, Pacific Time
starting_bankroll: 500              # dollars; used by `reef.py reset`

# --- Kalshi public API (read-only) ---
api_base: https://external-api.kalshi.com/trade-api/v2    # per docs.kalshi.com quick start (Oct 2026)
api_base_fallback: https://api.elections.kalshi.com/trade-api/v2
series: KXNBAGAME,KXNBASPREAD,KXNBATOTAL                   # game winner, spread, total
orderbook_depth: 20

# --- Kalshi fees (kalshi.com/docs/kalshi-fee-schedule.pdf, eff. July 7 2026) ---
# fee = roundup(M x rate x C x P x (1-P)); NBA series report fee_type quadratic_with_maker_fees, fee_multiplier 1
taker_fee_rate: 0.07
maker_fee_rate: 0.0175
fee_multiplier: 1
fee_round_to: 0.01                  # conservative: round each fill's fee up to the next cent
assume_taker: true                  # paper fills cross the spread (no resting maker orders)

# --- edge hurdle (after spread, slippage, entry fee, and est. exit costs for trade style) ---
min_edge_cents: 2                   # EV per contract after ALL costs must be >= 2 cents
min_edge_pct: 0.03                  # ...AND >= 3% of all-in cost per contract (both must clear)
slippage_buffer_cents: 0            # extra cents/contract on top of the depth walk (latency cushion)

# --- confidence + sizing ---
min_confidence: 75                  # 0-100; below = 'passed', never placed
tier_95_pct: 0.20                   # confidence 95+   -> 20% of current bankroll
tier_85_pct: 0.15                   # confidence 85-94 -> 15%
tier_75_pct: 0.10                   # confidence 75-84 -> 10%
per_trade_cap: 100                  # hard dollar cap per trade (all-in cost incl. fees)
nightly_exposure_cap: 0.60          # max open all-in cost per night, % of current bankroll
max_picks: 20                       # allow full NBA slate (AUTO_DRAFT targets every game)

# --- live monitor ---
poll_seconds: 15                    # orderbook poll interval
min_poll_seconds: 5                 # floor; never poll faster (polite rate use)
request_spacing_seconds: 1         # min gap between API calls; 429s back off per Retry-After

# --- AUTO_DRAFT + tip-relative schedule (draft_picks.py / run_daily_if_due.py) ---
# Not human research. Hourly GitHub Action checks ESPN tip times (no API key);
# Kalshi occurrence_datetime is the fallback. Runs only in [first_tip - buffer, first_tip).
draft:
  draft_confidence: 76              # fixed; just above min_confidence — gates may still reject
  draft_fair_bump: 0.03             # fair_prob = Kalshi YES mid + bump
  draft_style: hold
  draft_max_picks: 0                # 0 = every open KXNBAGAME on the slate (no subset filter)
  draft_series: KXNBAGAME
  draft_buffer_minutes: 45          # start window this many minutes before first tip

# --- LIVE trading (NOT enabled) ---
# Reef ships paper-only. There is no order/portfolio client yet, and no Kalshi
# credentials in this repo. To go live later you must set ALL of:
#   live: true
#   plus env (names only; values never committed):
#     KALSHI_API_KEY_ID
#     KALSHI_PRIVATE_KEY_PATH   # PEM file path for RSA-PSS request signing
# Until then api_get() refuses /orders and /portfolio. Do not invent these values.
live: false

# --- in-game exit rules (exits.py; applied by `reef.py monitor` to every open position) ---
# Priority: confidence decay -> stop-loss -> blowout -> Q3 review -> profit target.
# Every sell must pass the fee-aware hold check (upside left to $1 vs exit fee + spread + slippage).
# Lists are quoted strings so both PyYAML and the stdlib flat parser read them the same way.
exits:
  exit_rules_enabled: true
  profit_targets: "0.30:0.40"             # gain:fraction; sell 40% at net mark +30%. Add tiers: "0.30:0.40, 0.60:0.25"
  stop_loss_pct: 0.15                     # exit remainder at net mark -15% vs entry cost...
  stop_debounce_polls: 2                  # ...only after 2 consecutive polls below it
  stop_debounce_seconds: 0                # if > 0, use time instead: breach must persist N seconds
  blowout_thresholds: "3:4:00:20, 4:12:00:15, 4:3:00:10"   # period:clock_left:lead (also applies in later periods)
  blowout_trim_fraction: 0.50             # right side of a blowout: trim 50% (wrong side: exit)
  q3_review: true                         # mandatory logged hold/trim/exit once Q3 ends
  q3_exit_deficit: 10                     # losing at Q3 review and trailing by >= 10 -> exit (else trim)
  trim_steps: "0.25,0.40,0.50"            # partial-scaling ladder
  confidence_decay: true
  decay_buffer: 3                         # exit when live conf < entry conf - 3 (0 = strict)
  decay_debounce_polls: 2                 # live read must stay below for 2 polls
  decay_sigma: 12.0                       # NBA final-margin std dev (pts) for the live win-prob model
  decay_w_model: 0.5                      # conf pts per 1pp change in live model win prob
  decay_w_price: 0.25                     # conf pts per 1c move in Kalshi mid vs entry mid
